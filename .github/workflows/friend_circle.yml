name: Friend Circle

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'results/**'
      - '**.md'

env:
  TZ: Asia/Shanghai
  FRIEND_CIRCLE_IGNORE_URL: ${{ secrets.FRIEND_CIRCLE_IGNORE_URL }}
  FRIEND_CIRCLE_IMPORT_URL: ${{ secrets.FRIEND_CIRCLE_IMPORT_URL }}
  FRIEND_CIRCLE_IMPORT_TOKEN: ${{ secrets.FRIEND_CIRCLE_IMPORT_TOKEN }}

concurrency:
  group: friend-circle
  cancel-in-progress: false

jobs:
  friend-circle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Pull Latest Repository
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Check RSS feeds
      run: go run .

    - name: Show grab log
      if: always()
      run: cat results/grab.log

    - name: Diagnose import endpoints
      if: always()
      run: |
        for url in "$FRIEND_CIRCLE_IMPORT_URL" "$FRIEND_CIRCLE_IGNORE_URL" "https://blog.xwysyy.com/api/friend-circle/articles/import"; do
          host=$(printf '%s' "$url" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')
          echo "=== host: $host"
          dig +noall +answer "$host" || true
          curl -sS -o /dev/null -D - --max-time 20 "$url" | grep -i -E '^(HTTP|server|via|x-error-code|cf-ray|x-vercel-id|x-vercel-error)' || true
        done
