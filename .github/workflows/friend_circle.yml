name: Friend Circle

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'results/**'
      - '**.md'

env:
  TZ: Asia/Shanghai
  FRIEND_CIRCLE_IGNORE_URL: ${{ secrets.FRIEND_CIRCLE_IGNORE_URL }}
  FRIEND_CIRCLE_IMPORT_URL: ${{ secrets.FRIEND_CIRCLE_IMPORT_URL }}
  FRIEND_CIRCLE_IMPORT_TOKEN: ${{ secrets.FRIEND_CIRCLE_IMPORT_TOKEN }}

concurrency:
  group: friend-circle
  cancel-in-progress: false

jobs:
  friend-circle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Pull Latest Repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check RSS feeds
      run: go run .
